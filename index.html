<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thi thử trắc nghiệm</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f1f5f9;color:#1e293b}
  .wrap{max-width:820px;margin:0 auto;padding:16px}
  h1{font-size:22px;text-align:center} h2{font-size:18px}
  .card{background:#fff;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 1px 4px rgba(0,0,0,.1)}
  button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 16px;background:#2563eb;color:#fff}
  button.sec{background:#e2e8f0;color:#1e293b}
  button.danger{background:#dc2626}
  button:disabled{opacity:.5;cursor:default}
  .menu button{display:block;width:100%;margin:8px 0;text-align:left;padding:14px}
  /* NEW: chữ mô tả nhỏ hơn một chút */
  .menu button .muted{color:#fff;font-style:italic;font-size:13px;opacity:.9}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .spacer{flex:1}
  .opt{display:block;width:100%;text-align:left;background:#fff;color:#1e293b;border:2px solid #cbd5e1;margin:8px 0;padding:12px}
  .opt.sel{border-color:#2563eb;background:#eff6ff}
  .opt.ok{border-color:#16a34a;background:#dcfce7}
  .opt.bad{border-color:#dc2626;background:#fee2e2}
  .grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .grid button{width:38px;height:38px;padding:0;background:#e2e8f0;color:#1e293b}
  .grid button.done{background:#93c5fd}
  .grid button.cur{outline:3px solid #1d4ed8}
  .grid button.ok{background:#86efac}.grid button.bad{background:#fca5a5}
  .timer{font-weight:bold;font-size:18px;color:#dc2626}
  .quota label{display:flex;justify-content:space-between;align-items:center;margin:6px 0}
  .quota input{width:80px;padding:6px;font:inherit}
  .muted{color:#64748b;font-size:14px}
  .score{font-size:32px;font-weight:bold;text-align:center;color:#2563eb}
  .score10{font-size:20px;text-align:center;margin:4px 0}
  .hist{border-bottom:1px solid #e2e8f0;padding:10px 0}
  .hist:last-child{border:0}
  .chk{display:flex;gap:8px;align-items:center;margin:10px 0;cursor:pointer}
  .chk input{width:18px;height:18px}

  /* ====== Máy bay kéo cờ ====== */
  .sky{position:relative;height:230px;overflow:hidden;pointer-events:none;margin-top:6px}
  .flyer{position:absolute;left:0;top:0;height:60px;display:flex;align-items:center;will-change:transform}
  .flyer.r{flex-direction:row}
  .flyer.r .trail{flex-direction:row-reverse}
  .flyer.l{flex-direction:row-reverse}
  .flyer.l .trail{flex-direction:row}
  .trail{display:flex;align-items:center;width:166px}
  .rope{height:2px;background:#64748b;flex:none}
  .rope.a{width:14px}
  .rope.b{width:12px}
  .banner{flex:none;width:104px;height:28px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(#3b82f6,#1d4ed8);color:#fff;font-weight:800;font-size:13px;letter-spacing:.5px;
    animation:wave .5s ease-in-out infinite alternate}
  .flyer.r .banner{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,14% 50%)}
  .flyer.l .banner{clip-path:polygon(0 0,100% 0,86% 50%,100% 100%,0 100%)}
  .vnflag{flex:none;width:36px;height:24px;background:#da251d;display:flex;align-items:center;justify-content:center;
    animation:wave .5s ease-in-out .25s infinite alternate}
  .vnflag i{display:block;width:14px;height:14px;background:#ffff00;
    clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
  .plane{flex:none;width:110px;height:59px;overflow:visible}
  .plane .prop{transform-box:fill-box;transform-origin:center;animation:spin .12s linear infinite}
  @keyframes spin{50%{transform:scaleY(.15)}}
  @keyframes wave{from{transform:translateY(-3px) skewY(-4deg)}to{transform:translateY(3px) skewY(4deg)}}
   /* ====== Thanh thống kê truy cập ====== */
  .vs-bar{--vs-accent:#2563eb;--vs-bg:#0f172a;--vs-text:#fff;--vs-muted:#94a3b8;
    display:flex;justify-content:center;align-items:center;gap:40px;padding:28px 20px;margin-top:30px;
    background:var(--vs-bg);border-top:3px solid var(--vs-accent)}
  .vs-item{text-align:center;min-width:120px}
  .vs-num{display:inline-block;font-size:32px;font-weight:700;color:var(--vs-text);
    letter-spacing:.5px;font-variant-numeric:tabular-nums}
  .vs-label{display:block;margin-top:4px;font-size:12px;text-transform:uppercase;
    letter-spacing:1.5px;color:var(--vs-muted)}
  .vs-divider{width:1px;height:44px;background:rgba(255,255,255,.15)}
  @media (max-width:600px){
    .vs-bar{gap:18px;padding:22px 10px}
    .vs-num{font-size:22px}
    .vs-label{font-size:10px;letter-spacing:1px}
    .vs-item{min-width:0}
    .vs-divider{height:34px}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>📝 Ôn luyện &amp; Thi thử</h1>
  <div id="app"></div>
</div>
 <div class="vs-bar">
  <div class="vs-item"><span class="vs-num" id="vs-total">0</span><span class="vs-label">Tổng lượt truy cập</span></div>
  <div class="vs-divider"></div>
  <div class="vs-item"><span class="vs-num" id="vs-today">0</span><span class="vs-label">Hôm nay</span></div>
  <div class="vs-divider"></div>
  <div class="vs-item"><span class="vs-num" id="vs-yesterday">0</span><span class="vs-label">Hôm qua</span></div>
</div>

<script>
/* ================= CẤU HÌNH ================= */
// Liệt kê tên file Excel ở đây.
// Nếu để trống [], web sẽ tự dò các file .xlsx trong repo qua GitHub API (chỉ chạy khi host trên github.io).
const FILES = [
 "van hoa full.xlsx",
];
// Đặt mật khẩu cho mục nào thì ghi vào đây (tên file phải giống hệt trong FILES).
// Mục nào không ghi, hoặc để "" thì vào tự do, không có khóa.
const LOCKS = {
 "van hoa full.xlsx": "1234",
};
// NEW: Dòng diễn giải hiển thị dưới tên chủ đề (tên file phải giống hệt trong FILES).
// Mục nào không ghi thì chỉ hiện tên chủ đề.
const DESCS = {
 "van hoa full.xlsx": "Văn hóa + chuyên môn QLCP xây dựng",
};
const EXAM_MINUTES = 60;
const TOTAL = 40;
const DEFAULT_QUOTA = {nq:14, nv:12, kt:8, qd:6};
const QUOTA_LABEL = {nq:"Nghị quyết", nv:"Nhiệm vụ", kt:"Kiến thức chung", qd:"Quy định, quy chế"};
const HISTORY_KEY = "thi_history_v1";
const SHUFFLE_KEY = "thi_shuffle_opts";
const HISTORY_MAX = 100;
/* ============================================ */

const $app = document.getElementById('app');
let data = [];
let fileName = "";
let session = null;
let timerId = null;
let shuffleOpts = localStorage.getItem(SHUFFLE_KEY) !== "0";   // mặc định BẬT

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = [...a]; for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const catKey = s => {
  s = String(s||"").toLowerCase().trim();
  if (s.includes("nghi quyet")) return "nq";
  if (s.includes("nhiem vu")) return "nv";
  if (s.includes("kien thuc chung")) return "kt";
  if (s.includes("quy dinh") || s.includes("quy chế")) return "qd";
  if (s.includes("chuyen mon")) return "cm";
  return "other:" + s;
};
const CULTURE = ["nq","nv","kt","qd"];
const fmtScore = n => (Math.round(n*100)/100).toString().replace('.', ',');
const fmtTime = sec => `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;

/* ---------- Lịch sử (localStorage) ---------- */
function getHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch (e) { return []; }
}
function saveHistory(entry) {
  try {
    const h = getHistory(); h.unshift(entry);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(h.slice(0, HISTORY_MAX)));
  } catch (e) {}
}
function historyScreen() {
  clearInterval(timerId); session = null;
  const h = getHistory();
  let html = `<div class="card"><h2>📜 Lịch sử thi thử</h2>`;
  if (!h.length) html += `<p class="muted">Chưa có bài thi nào được lưu.</p>`;
  else {
    const avg = h.reduce((t, x) => t + x.score10, 0) / h.length;
    html += `<p class="muted">${h.length} bài • điểm trung bình ${fmtScore(avg)}/10</p>`;
    h.forEach(x => {
      html += `<div class="hist">
        <b>${esc(x.exam)}</b> – ${esc(x.label)}<br>
        <span class="muted">${esc(new Date(x.date).toLocaleString('vi-VN'))} • thời gian ${fmtTime(x.used)}</span><br>
        Đúng ${x.right}/${x.total} • Sai ${x.wrong} • Bỏ trống ${x.blank} • <b>${fmtScore(x.score10)}/10</b>
      </div>`;
    });
  }
  html += `<div class="row" style="margin-top:12px">
    <button class="sec" onclick="home()">← Quay lại</button>
    <span class="spacer"></span>
    ${h.length ? `<button class="danger" onclick="clearHistory()">Xóa lịch sử</button>` : ""}
  </div></div>`;
  $app.innerHTML = html;
}
function clearHistory() {
  if (confirm("Xóa toàn bộ lịch sử?")) { localStorage.removeItem(HISTORY_KEY); historyScreen(); }
}

/* ---------- Màn hình 1: chọn file ---------- */
async function home() {
  clearInterval(timerId); session = null;
  $app.innerHTML = `<div class="card"><h2>Chọn chủ đề</h2><div class="menu" id="list">Đang tải danh sách...</div>
    <button class="sec" onclick="historyScreen()">📜 Lịch sử thi thử</button></div>
    <div class="sky" id="sky">
      <div class="flyer r">
        <div class="trail">
          <div class="rope a"></div>
          <div class="banner">QLCP BXD</div>
          <div class="rope b"></div>
          <div class="vnflag"><i></i></div>
        </div>
        <svg class="plane" viewBox="0 0 150 80" xmlns="http://www.w3.org/2000/svg">
          <!-- đuôi -->
          <polygon points="34,50 10,26 22,26 50,44" fill="#dc2626"/>
          <polygon points="22,54 4,58 6,50 26,48" fill="#b91c1c"/>
          <!-- bánh xe -->
          <line x1="70" y1="60" x2="66" y2="72" stroke="#475569" stroke-width="3"/>
          <line x1="100" y1="60" x2="104" y2="72" stroke="#475569" stroke-width="3"/>
          <circle cx="66" cy="73" r="5" fill="#1e293b"/><circle cx="104" cy="73" r="5" fill="#1e293b"/>
          <!-- thân -->
          <ellipse cx="78" cy="50" rx="48" ry="14" fill="#ef4444"/>
          <path d="M40,52 Q78,60 116,52" fill="none" stroke="#fff" stroke-width="2"/>
          <rect x="62" y="56" width="46" height="8" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
          <!-- mũi + cánh quạt -->
          <circle cx="126" cy="50" r="5" fill="#475569"/>
          <ellipse class="prop" cx="130" cy="50" rx="3" ry="17" fill="#64748b" opacity=".8"/>
          <!-- cô phi công -->
          <circle cx="84" cy="27" r="15" fill="#7c3aed"/>
          <circle cx="84" cy="29" r="12.5" fill="#fde0c8"/>
          <path d="M71,24 Q84,14 97,24 Q84,20 71,24Z" fill="#7c3aed"/>
          <circle cx="79" cy="29" r="5" fill="#fff" stroke="#1e293b" stroke-width="1.5"/>
          <circle cx="90" cy="29" r="5" fill="#fff" stroke="#1e293b" stroke-width="1.5"/>
          <line x1="84" y1="29" x2="85" y2="29" stroke="#1e293b" stroke-width="1.5"/>
          <circle cx="80" cy="29" r="1.8" fill="#1e293b"/><circle cx="91" cy="29" r="1.8" fill="#1e293b"/>
          <path d="M80,36 Q84.5,40 89,36" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="74" cy="34" r="2.2" fill="#fca5a5" opacity=".7"/><circle cx="95" cy="34" r="2.2" fill="#fca5a5" opacity=".7"/>
          <!-- mũ có cánh -->
          <path d="M70,21 Q70,6 84,6 Q98,6 98,21 Q84,15 70,21Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
          <path d="M70,15 L58,10 L61,20Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width=".8"/>
          <path d="M98,15 L110,10 L107,20Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width=".8"/>
          <!-- khăn quàng -->
          <polygon points="76,42 60,50 66,40" fill="#facc15"/>
          <ellipse cx="84" cy="41" rx="12" ry="4" fill="#facc15"/>
        </svg>
      </div>
    </div>`;
  startSky();
  let files = FILES;
  if (!files.length) files = await autoList();
  const list = document.getElementById('list');
  if (!list) return;
  if (!files.length) {
    list.innerHTML = `<p>Chưa tìm thấy file Excel. Hãy điền tên file vào mảng <b>FILES</b> trong index.html.</p>`;
    return;
  }
  list.innerHTML = "";
  files.forEach(f => {
    const b = document.createElement('button');
    const locked = !!LOCKS[f];
    // NEW: tiêu đề + dòng diễn giải bên dưới
    const title = (locked ? "🔒 " : "📂 ") + f.replace(/\.xlsx?$/i, "");
    b.innerHTML = esc(title) + (DESCS[f] ? `<br><span class="muted">${esc(DESCS[f])}</span>` : "");
    b.onclick = () => openTopic(f);
    list.appendChild(b);
  });
}
const unlocked = new Set();   // mục đã nhập đúng mật khẩu (nhớ đến khi tải lại trang)
function openTopic(f) {
  const pw = LOCKS[f];
  if (pw && !unlocked.has(f)) {
    const input = prompt('Mục "' + f.replace(/\.xlsx?$/i, "") + '" có mật khẩu.\nNhập mật khẩu để vào:');
    if (input === null) return;                       // bấm Hủy
    if (input.trim() !== String(pw)) { alert("Sai mật khẩu!"); return; }
    unlocked.add(f);
  }
  loadFile(f);
}
async function autoList() {
  try {
    const host = location.hostname;
    if (!host.endsWith("github.io")) return [];
    const owner = host.split(".")[0];
    const repo = location.pathname.split("/").filter(Boolean)[0];
    const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/`);
    const j = await r.json();
    return j.filter(x => /\.xlsx?$/i.test(x.name)).map(x => x.name);
  } catch (e) { return []; }
}

/* ---------- Đọc Excel ---------- */
async function loadFile(f) {
  $app.innerHTML = `<div class="card">Đang tải "${esc(f)}"...</div>`;
  try {
    // thử tên gốc và cả 2 kiểu mã hóa dấu tiếng Việt
    const names = [...new Set([f, f.normalize("NFC"), f.normalize("NFD")])];
    let res = null, lastStatus = "";
    for (const n of names) {
      const r = await fetch(encodeURIComponent(n).replace(/%2F/g, "/"));
      if (r.ok) { res = r; break; }
      lastStatus = r.status;
    }
    if (!res) throw new Error("Không tìm thấy file trên GitHub (lỗi " + lastStatus + "): " + f +
      ". Hãy kiểm tra tên file thật trong repo (có thể thừa đuôi .xlsx.xlsx hoặc khác chữ hoa/thường).");
    if (typeof XLSX === "undefined")
      throw new Error("Thư viện đọc Excel không tải được. Kiểm tra mạng hoặc thử mạng khác.");
    const wb = XLSX.read(await res.arrayBuffer(), {type: "array"});
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1, defval: ""});
    data = rows.slice(1).filter(r => r[1] && String(r[6]).trim() !== "").map(r => ({
      cat: String(r[0]).trim(), key: catKey(r[0]),
      q: String(r[1]), opts: [r[2], r[3], r[4], r[5]].map(String),
      ans: parseInt(r[6]) - 1
    }));
    if (!data.length)
      throw new Error("Đọc được file nhưng không có câu hỏi hợp lệ. Kiểm tra cột câu hỏi và cột trả lời.");
    fileName = f.replace(/\.xlsx?$/i, "");
    modeMenu();
  } catch (e) {
    $app.innerHTML = `<div class="card"><b>Không tải được file.</b><br>
      <span class="muted">Chi tiết: ${esc(e.message)}</span><br><br>
      <button onclick="home()">← Quay lại</button></div>`;
  }
}

/* ---------- Màn hình 2: Ôn luyện / Thi thử ---------- */
function modeMenu() {
  $app.innerHTML = `<div class="card"><h2>${esc(fileName)}</h2>
    <p class="muted">${data.length} câu hỏi</p>
    <label class="chk"><input type="checkbox" id="shufOpt" ${shuffleOpts?"checked":""} onchange="setShuffle(this.checked)">
      Xáo trộn thứ tự đáp án A/B/C/D</label>
    <div class="menu">
      <button onclick="practiceMenu()">📖 Ôn luyện</button>
      <button onclick="examMenu()">⏱️ Thi thử</button>
    </div><button class="sec" onclick="home()">← Chọn chủ đề khác</button></div>`;
}
function setShuffle(v) { shuffleOpts = v; localStorage.setItem(SHUFFLE_KEY, v ? "1" : "0"); }

/* ---------- 2.1 Ôn luyện ---------- */
function practiceMenu() {
  const seen = new Map();
  data.forEach(d => { if (!seen.has(d.key)) seen.set(d.key, d.cat); });
  let html = `<div class="card"><h2>Ôn luyện – chọn phần</h2><div class="menu">`;
  const hasCulture = CULTURE.some(k => seen.has(k));
  if (hasCulture) html += `<button onclick="startPractice('culture')">🎓 Văn hóa (nghị quyết + nhiệm vụ + kiến thức chung + quy định, quy chế)</button>`;
  seen.forEach((label, key) => {
    const n = data.filter(d => d.key === key).length;
    html += `<button onclick="startPractice('${esc(key).replace(/'/g,"\\'")}')">${esc(label)} <span class="muted">(${n} câu)</span></button>`;
  });
  html += `</div><button class="sec" onclick="modeMenu()">← Quay lại</button></div>`;
  $app.innerHTML = html;
}
function startPractice(key) {
  const pool = key === 'culture' ? data.filter(d => CULTURE.includes(d.key)) : data.filter(d => d.key === key);
  const label = key === 'culture' ? "Ôn luyện văn hóa" : "Ôn luyện " + (pool[0]?.cat || "");
  begin(shuffle(pool), 'practice', label);
}

/* ---------- 2.2 Thi thử ---------- */
function examMenu() {
  $app.innerHTML = `<div class="card"><h2>Thi thử</h2>
    <p class="muted">Mỗi đề ${TOTAL} câu – ${EXAM_MINUTES} phút.</p>
    <div class="menu"><button onclick="startExam('cm')">🔧 Thi chuyên môn (${TOTAL} câu ngẫu nhiên)</button></div>
    <h3>🎓 Thi văn hóa – số câu mỗi loại</h3>
    <div class="quota">
      ${CULTURE.map(k=>`<label>${QUOTA_LABEL[k]}<input type="number" min="0" id="q_${k}" placeholder="${DEFAULT_QUOTA[k]}"></label>`).join("")}
    </div>
    <p class="muted">Để trống sẽ dùng mặc định 14 – 12 – 8 – 6.</p>
    <button onclick="startExam('vh')">Bắt đầu thi văn hóa</button>
    <button class="sec" onclick="modeMenu()">← Quay lại</button></div>`;
}
function startExam(type) {
  let picked = [], warn = [];
  if (type === 'cm') {
    const pool = data.filter(d => d.key === 'cm');
    if (pool.length < TOTAL) warn.push(`Chuyên môn chỉ có ${pool.length}/${TOTAL} câu.`);
    picked = shuffle(pool).slice(0, TOTAL);
  } else {
    // Thứ tự nhóm: Nghị quyết -> Nhiệm vụ -> Kiến thức chung -> Quy định, quy chế
    // (trong mỗi nhóm vẫn chọn ngẫu nhiên, KHÔNG xáo trộn lại toàn bộ)
    CULTURE.forEach(k => {
      const v = document.getElementById('q_'+k).value;
      const want = v === "" ? DEFAULT_QUOTA[k] : Math.max(0, parseInt(v)||0);
      const pool = data.filter(d => d.key === k);
      if (pool.length < want) warn.push(`${QUOTA_LABEL[k]}: chỉ có ${pool.length}/${want} câu.`);
      picked.push(...shuffle(pool).slice(0, want));
    });
  }
  if (!picked.length) { alert("Không có câu hỏi phù hợp."); return; }
  if (warn.length && !confirm(warn.join("\n") + "\nVẫn tiếp tục thi với số câu hiện có?")) return;
  begin(picked, 'exam', type === 'cm' ? "Thi chuyên môn" : "Thi văn hóa");
}

/* ---------- Làm bài (chung) ---------- */
function mixOptions(q) {
  if (!shuffleOpts) return {...q};
  const idx = shuffle([0,1,2,3].filter(i => i < q.opts.length));
  return {...q, opts: idx.map(i => q.opts[i]), ans: idx.indexOf(q.ans)};
}
function begin(questions, mode, label) {
  const qs = questions.map(mixOptions);
  session = {qs, mode, label, i: 0, ch: new Array(qs.length).fill(-1), finished: false,
             start: Date.now(), end: Date.now() + EXAM_MINUTES*60000};
  clearInterval(timerId);
  if (mode === 'exam') timerId = setInterval(tick, 500);
  render();
}
function tick() {
  if (!session || session.finished) return;
  const left = Math.max(0, session.end - Date.now());
  const el = document.getElementById('timer');
  if (el) el.textContent = "⏱ " + fmtTime(Math.ceil(left/1000));
  if (left <= 0) finish();
}
function render() {
  const s = session, q = s.qs[s.i], ex = s.mode === 'exam';
  const revealed = s.finished || (!ex && s.ch[s.i] >= 0);
  let opts = q.opts.map((t, k) => {
    let cls = "opt";
    if (revealed) { if (k === q.ans) cls += " ok"; else if (k === s.ch[s.i]) cls += " bad"; }
    else if (s.ch[s.i] === k) cls += " sel";
    return `<button class="${cls}" onclick="choose(${k})">${"ABCD"[k]}. ${esc(t)}</button>`;
  }).join("");
  const grid = s.qs.map((_, n) => {
    let c = n === s.i ? "cur " : "";
    if (s.finished || (!ex && s.ch[n] >= 0)) c += s.ch[n] === s.qs[n].ans ? "ok" : (s.ch[n] >= 0 ? "bad" : "");
    else if (s.ch[n] >= 0) c += "done";
    return `<button class="${c}" onclick="go(${n})">${n+1}</button>`;
  }).join("");
  $app.innerHTML = `
    <div class="card">
      <div class="row"><b>Câu ${s.i+1}/${s.qs.length}</b><span class="muted">${esc(q.cat)}</span><span class="spacer"></span>
        ${ex && !s.finished ? `<span class="timer" id="timer"></span>` : ""}</div>
      <p style="font-size:18px">${esc(q.q)}</p>${opts}
      <div class="row" style="margin-top:12px">
        <button class="sec" onclick="go(${s.i-1})" ${s.i===0?"disabled":""}>← Trước</button>
        <button class="sec" onclick="go(${s.i+1})" ${s.i===s.qs.length-1?"disabled":""}>Sau →</button>
        <span class="spacer"></span>
        ${s.finished ? `<button onclick="showResult()">Xem kết quả</button>` :
          ex ? `<button onclick="if(confirm('Nộp bài?'))finish()">Nộp bài</button>` :
               `<button class="sec" onclick="if(confirm('Thoát ôn luyện?'))practiceMenu()">Thoát</button>`}
      </div>
      <div class="grid">${grid}</div>
    </div>`;
  if (ex && !s.finished) tick();
}
function choose(k) {
  const s = session;
  if (s.finished) return;
  if (s.mode === 'practice' && s.ch[s.i] >= 0) return;
  s.ch[s.i] = k; render();
}
function go(n) { if (n>=0 && n<session.qs.length) { session.i = n; render(); } }
function stats() {
  const s = session;
  const right = s.qs.filter((q, i) => s.ch[i] === q.ans).length;
  const blank = s.ch.filter(c => c < 0).length;
  const total = s.qs.length;
  return {right, blank, wrong: total - right - blank, total, score10: total ? right / total * 10 : 0};
}
function finish() {
  if (!session || session.finished) return;
  clearInterval(timerId);
  session.finished = true;
  const st = stats();
  if (session.mode === 'exam') {
    saveHistory({
      date: Date.now(), exam: fileName, label: session.label,
      used: Math.min(EXAM_MINUTES*60, Math.round((Date.now() - session.start)/1000)),
      ...st
    });
  }
  showResult();
}
function showResult() {
  const s = session, st = stats();
  $app.innerHTML = `<div class="card">
    <h2 style="text-align:center">Kết quả – ${esc(s.label)}</h2>
    <div class="score">${st.right}/${st.total}</div>
    <div class="score10">Điểm: <b>${fmtScore(st.score10)}</b>/10</div>
    <p style="text-align:center">Đúng ${st.right} • Sai ${st.wrong} • Bỏ trống ${st.blank}</p>
    ${s.mode === 'exam' ? `<p class="muted" style="text-align:center">Kết quả đã được lưu vào lịch sử.</p>` : ""}
    <div class="row" style="justify-content:center">
      <button onclick="session.i=0;render()">Xem lại bài làm</button>
      <button class="sec" onclick="modeMenu()">Về menu</button>
      <button class="sec" onclick="historyScreen()">📜 Lịch sử</button>
      <button class="sec" onclick="home()">Chọn chủ đề khác</button>
    </div></div>`;
}

/* ---------- Máy bay kéo cờ ---------- */
let skyRaf = null;
function startSky() {
  cancelAnimationFrame(skyRaf);
  const sky = document.getElementById('sky');
  if (!sky) return;
  const fl = sky.querySelector('.flyer'), plane = fl.querySelector('.plane');
  const LANES = [45, 90, 135, 180];   // độ cao 4 làn bay
  const SPEED = 140;                  // px/giây
  const TRAIL = 166, HALF = 55;       // chiều dài cờ, nửa thân máy bay
  let W = 0, pts = [], cum = [], total = 0, dist = 0, last = performance.now(), dir = 0;

  function build() {
    const xl = 20, xr = W - 20, rx = 40;
    pts = [[W + 120, LANES[0]], [xl, LANES[0]]];
    const turn = (x, s, y1, y2) => {
      const r = (y2 - y1) / 2, cy = (y1 + y2) / 2;
      for (let k = 1; k <= 24; k++) {
        const th = k / 24 * Math.PI;
        pts.push([x + s * rx * Math.sin(th), cy - r * Math.cos(th)]);
      }
    };
    turn(xl, -1, LANES[0], LANES[1]); pts.push([xr, LANES[1]]);
    turn(xr, +1, LANES[1], LANES[2]); pts.push([xl, LANES[2]]);
    turn(xl, -1, LANES[2], LANES[3]); pts.push([W + 330, LANES[3]]);
    cum = [0];
    for (let i = 1; i < pts.length; i++)
      cum.push(cum[i-1] + Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]));
    total = cum[cum.length - 1];
  }

  function frame(now) {
    if (!document.body.contains(sky)) return;        // đã rời màn hình chủ đề
    const w = sky.clientWidth;
    if (w !== W) { const ratio = total ? dist / total : 0; W = w; build(); dist = ratio * total; }
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    dist += SPEED * dt;
    if (dist >= total) dist -= total;                // hết làn 4 -> bay lại từ đầu

    let i = 1;
    while (i < cum.length - 1 && cum[i] < dist) i++;
    const a = pts[i-1], b = pts[i];
    const t = (dist - cum[i-1]) / ((cum[i] - cum[i-1]) || 1);
    const x = a[0] + (b[0]-a[0]) * t, y = a[1] + (b[1]-a[1]) * t;
    const dx = b[0]-a[0], dy = b[1]-a[1];

    if (Math.abs(dx) > 0.001) {
      const nd = dx > 0 ? 1 : -1;
      if (nd !== dir) { dir = nd; fl.className = 'flyer ' + (dir === 1 ? 'r' : 'l'); }
    }
    const tilt = Math.atan2(dy, Math.abs(dx) || 1) * 180 / Math.PI * 0.6;
    plane.style.transform = `scaleX(${dir || 1}) rotate(${tilt}deg)`;
    const anchor = dir === 1 ? TRAIL + HALF : HALF;
    fl.style.transform = `translate(${x - anchor}px, ${y - 30}px)`;
    skyRaf = requestAnimationFrame(frame);
  }
  skyRaf = requestAnimationFrame(frame);
}

home();
</script>
 <script>
(function () {
  var NS = "thithu-ten-rieng-cua-anh";   // <-- ĐỔI thành tên riêng, không dấu, không khoảng trắng
  var BASE = "https://abacus.jasoncameron.dev";

  function dayKey(offset) {
    var d = new Date(Date.now() + offset * 86400000);
    return "d" + d.getFullYear() + ("0" + (d.getMonth() + 1)).slice(-2) + ("0" + d.getDate()).slice(-2);
  }
  function call(action, key) {
    return fetch(BASE + "/" + action + "/" + NS + "/" + key)
      .then(function (r) { return r.ok ? r.json() : { value: 0 }; })
      .then(function (j) { return j.value || 0; })
      .catch(function () { return 0; });
  }
  function animate(id, target) {
    var el = document.getElementById(id), start = null, duration = 1200;
    function step(t) {
      if (!start) start = t;
      var p = Math.min((t - start) / duration, 1);
      el.textContent = Math.floor(target * (1 - Math.pow(1 - p, 3))).toLocaleString("vi-VN");
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  var today = dayKey(0), yesterday = dayKey(-1);
  var counted = localStorage.getItem("vs_last") === today;   // mỗi trình duyệt chỉ tính 1 lượt/ngày
  var action = counted ? "get" : "hit";
  if (!counted) localStorage.setItem("vs_last", today);

  Promise.all([call(action, "total"), call(action, today), call("get", yesterday)])
    .then(function (v) {
      animate("vs-total", v[0]);
      animate("vs-today", v[1]);
      animate("vs-yesterday", v[2]);
    });
})();
</script>
