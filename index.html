<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thi thử trắc nghiệm</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f1f5f9;color:#1e293b}
  .wrap{max-width:820px;margin:0 auto;padding:16px}
  h1{font-size:22px;text-align:center} h2{font-size:18px}
  .card{background:#fff;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 1px 4px rgba(0,0,0,.1)}
  button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 16px;background:#2563eb;color:#fff}
  button.sec{background:#e2e8f0;color:#1e293b}
  button.danger{background:#dc2626}
  button:disabled{opacity:.5;cursor:default}
  .menu button{display:block;width:100%;margin:8px 0;text-align:left;padding:14px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .spacer{flex:1}
  .opt{display:block;width:100%;text-align:left;background:#fff;color:#1e293b;border:2px solid #cbd5e1;margin:8px 0;padding:12px}
  .opt.sel{border-color:#2563eb;background:#eff6ff}
  .opt.ok{border-color:#16a34a;background:#dcfce7}
  .opt.bad{border-color:#dc2626;background:#fee2e2}
  .grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .grid button{width:38px;height:38px;padding:0;background:#e2e8f0;color:#1e293b}
  .grid button.done{background:#93c5fd}
  .grid button.cur{outline:3px solid #1d4ed8}
  .grid button.ok{background:#86efac}.grid button.bad{background:#fca5a5}
  .timer{font-weight:bold;font-size:18px;color:#dc2626}
  .quota label{display:flex;justify-content:space-between;align-items:center;margin:6px 0}
  .quota input{width:80px;padding:6px;font:inherit}
  .muted{color:#64748b;font-size:14px}
  .score{font-size:32px;font-weight:bold;text-align:center;color:#2563eb}
  .score10{font-size:20px;text-align:center;margin:4px 0}
  .hist{border-bottom:1px solid #e2e8f0;padding:10px 0}
  .hist:last-child{border:0}
  .chk{display:flex;gap:8px;align-items:center;margin:10px 0;cursor:pointer}
  .chk input{width:18px;height:18px}
</style>
</head>
<body>
<div class="wrap">
  <h1>📝 Ôn luyện &amp; Thi thử</h1>
  <div id="app"></div>
</div>

<script>
/* ================= CẤU HÌNH ================= */
// Liệt kê tên file Excel ở đây.
// Nếu để trống [], web sẽ tự dò các file .xlsx trong repo qua GitHub API (chỉ chạy khi host trên github.io).
const FILES = [
  // "QLCP mảng xây dựng.xlsx",
  // "thi b.xlsx",
];
const EXAM_MINUTES = 60;
const TOTAL = 40;
const DEFAULT_QUOTA = {nq:14, nv:10, kt:8, qd:8};
const QUOTA_LABEL = {nq:"Nghị quyết", nv:"Nhiệm vụ", kt:"Kiến thức chung", qd:"Quy định, quy chế"};
const HISTORY_KEY = "thi_history_v1";
const SHUFFLE_KEY = "thi_shuffle_opts";
const HISTORY_MAX = 100;
/* ============================================ */

const $app = document.getElementById('app');
let data = [];
let fileName = "";
let session = null;
let timerId = null;
let shuffleOpts = localStorage.getItem(SHUFFLE_KEY) !== "0";   // mặc định BẬT

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = [...a]; for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const catKey = s => {
  s = String(s||"").toLowerCase().trim();
  if (s.includes("nghị quyết")) return "nq";
  if (s.includes("nhiệm vụ")) return "nv";
  if (s.includes("kiến thức")) return "kt";
  if (s.includes("quy định") || s.includes("quy chế")) return "qd";
  if (s.includes("chuyên môn")) return "cm";
  return "other:" + s;
};
const CULTURE = ["nq","nv","kt","qd"];
const fmtScore = n => (Math.round(n*100)/100).toString().replace('.', ',');
const fmtTime = sec => `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;

/* ---------- Lịch sử (localStorage) ---------- */
function getHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch (e) { return []; }
}
function saveHistory(entry) {
  try {
    const h = getHistory(); h.unshift(entry);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(h.slice(0, HISTORY_MAX)));
  } catch (e) {}
}
function historyScreen() {
  clearInterval(timerId); session = null;
  const h = getHistory();
  let html = `<div class="card"><h2>📜 Lịch sử thi thử</h2>`;
  if (!h.length) html += `<p class="muted">Chưa có bài thi nào được lưu.</p>`;
  else {
    const avg = h.reduce((t, x) => t + x.score10, 0) / h.length;
    html += `<p class="muted">${h.length} bài • điểm trung bình ${fmtScore(avg)}/10</p>`;
    h.forEach(x => {
      html += `<div class="hist">
        <b>${esc(x.exam)}</b> – ${esc(x.label)}<br>
        <span class="muted">${esc(new Date(x.date).toLocaleString('vi-VN'))} • thời gian ${fmtTime(x.used)}</span><br>
        Đúng ${x.right}/${x.total} • Sai ${x.wrong} • Bỏ trống ${x.blank} • <b>${fmtScore(x.score10)}/10</b>
      </div>`;
    });
  }
  html += `<div class="row" style="margin-top:12px">
    <button class="sec" onclick="home()">← Quay lại</button>
    <span class="spacer"></span>
    ${h.length ? `<button class="danger" onclick="clearHistory()">Xóa lịch sử</button>` : ""}
  </div></div>`;
  $app.innerHTML = html;
}
function clearHistory() {
  if (confirm("Xóa toàn bộ lịch sử?")) { localStorage.removeItem(HISTORY_KEY); historyScreen(); }
}

/* ---------- Màn hình 1: chọn file ---------- */
async function home() {
  clearInterval(timerId); session = null;
  $app.innerHTML = `<div class="card"><h2>Chọn chủ đề</h2><div class="menu" id="list">Đang tải danh sách...</div>
    <button class="sec" onclick="historyScreen()">📜 Lịch sử thi thử</button></div>`;
  let files = FILES;
  if (!files.length) files = await autoList();
  const list = document.getElementById('list');
  if (!files.length) {
    list.innerHTML = `<p>Chưa tìm thấy file Excel. Hãy điền tên file vào mảng <b>FILES</b> trong index.html.</p>`;
    return;
  }
  list.innerHTML = "";
  .forEach(f => {
    const b = document.createElement('button');
    b.textContent = "📂 " + f.replace(/\.xlsx?$/i, "");
    b.onclick = () => loadFile(f);
    list.appendChild(b);
  });
}
async function autoList() {
  try {
    const host = location.hostname;
    if (!host.endsWith("github.io")) return [];
    const owner = host.split(".")[0];
    const repo = location.pathname.split("/").filter(Boolean)[0];
    const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/`);
    const j = await r.json();
    return j.filter(x => /\.xlsx?$/i.test(x.name)).map(x => x.name);
  } catch (e) { return []; }
}

/* ---------- Đọc Excel ---------- */
async function loadFile(f) {
  $app.innerHTML = `<div class="card">Đang tải "${esc(f)}"...</div>`;
  try {
    const res = await fetch(encodeURIComponent(f).replace(/%2F/g,"/"));
    if (!res.ok) throw new Error(res.status);
    const wb = XLSX.read(await res.arrayBuffer(), {type:"array"});
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:""});
    data = rows.slice(1).filter(r => r[1] && String(r[6]).trim() !== "").map(r => ({
      cat: String(r[0]).trim(), key: catKey(r[0]),
      q: String(r[1]), opts: [r[2],r[3],r[4],r[5]].map(String),
      ans: parseInt(r[6]) - 1
    }));
    fileName = f.replace(/\.xlsx?$/i, "");
    modeMenu();
  } catch (e) {
    $app.innerHTML = `<div class="card">Không tải được file. Lưu ý: phải chạy qua GitHub Pages / web server (không mở trực tiếp file://).<br><br><button onclick="home()">← Quay lại</button></div>`;
  }
}

/* ---------- Màn hình 2: Ôn luyện / Thi thử ---------- */
function modeMenu() {
  $app.innerHTML = `<div class="card"><h2>${esc(fileName)}</h2>
    <p class="muted">${data.length} câu hỏi</p>
    <label class="chk"><input type="checkbox" id="shufOpt" ${shuffleOpts?"checked":""} onchange="setShuffle(this.checked)">
      Xáo trộn thứ tự đáp án A/B/C/D</label>
    <div class="menu">
      <button onclick="practiceMenu()">📖 Ôn luyện</button>
      <button onclick="examMenu()">⏱️ Thi thử</button>
    </div><button class="sec" onclick="home()">← Chọn chủ đề khác</button></div>`;
}
function setShuffle(v) { shuffleOpts = v; localStorage.setItem(SHUFFLE_KEY, v ? "1" : "0"); }

/* ---------- 2.1 Ôn luyện ---------- */
function practiceMenu() {
  const seen = new Map();
  data.forEach(d => { if (!seen.has(d.key)) seen.set(d.key, d.cat); });
  let html = `<div class="card"><h2>Ôn luyện – chọn phần</h2><div class="menu">`;
  const hasCulture = CULTURE.some(k => seen.has(k));
  if (hasCulture) html += `<button onclick="startPractice('culture')">🎓 Văn hóa (nghị quyết + nhiệm vụ + kiến thức chung + quy định, quy chế)</button>`;
  seen.forEach((label, key) => {
    const n = data.filter(d => d.key === key).length;
    html += `<button onclick="startPractice('${esc(key).replace(/'/g,"\\'")}')">${esc(label)} <span class="muted">(${n} câu)</span></button>`;
  });
  html += `</div><button class="sec" onclick="modeMenu()">← Quay lại</button></div>`;
  $app.innerHTML = html;
}
function startPractice(key) {
  const pool = key === 'culture' ? data.filter(d => CULTURE.includes(d.key)) : data.filter(d => d.key === key);
  const label = key === 'culture' ? "Ôn luyện văn hóa" : "Ôn luyện " + (pool[0]?.cat || "");
  begin(shuffle(pool), 'practice', label);
}

/* ---------- 2.2 Thi thử ---------- */
function examMenu() {
  $app.innerHTML = `<div class="card"><h2>Thi thử</h2>
    <p class="muted">Mỗi đề ${TOTAL} câu – ${EXAM_MINUTES} phút.</p>
    <div class="menu"><button onclick="startExam('cm')">🔧 Thi chuyên môn (${TOTAL} câu ngẫu nhiên)</button></div>
    <h3>🎓 Thi văn hóa – số câu mỗi loại</h3>
    <div class="quota">
      ${CULTURE.map(k=>`<label>${QUOTA_LABEL[k]}<input type="number" min="0" id="q_${k}" placeholder="${DEFAULT_QUOTA[k]}"></label>`).join("")}
    </div>
    <p class="muted">Để trống sẽ dùng mặc định 14 – 10 – 8 – 8.</p>
    <button onclick="startExam('vh')">Bắt đầu thi văn hóa</button>
    <button class="sec" onclick="modeMenu()">← Quay lại</button></div>`;
}
function startExam(type) {
  let picked = [], warn = [];
  if (type === 'cm') {
    const pool = data.filter(d => d.key === 'cm');
    if (pool.length < TOTAL) warn.push(`Chuyên môn chỉ có ${pool.length}/${TOTAL} câu.`);
    picked = shuffle(pool).slice(0, TOTAL);
  } else {
    CULTURE.forEach(k => {
      const v = document.getElementById('q_'+k).value;
      const want = v === "" ? DEFAULT_QUOTA[k] : Math.max(0, parseInt(v)||0);
      const pool = data.filter(d => d.key === k);
      if (pool.length < want) warn.push(`${QUOTA_LABEL[k]}: chỉ có ${pool.length}/${want} câu.`);
      picked.push(...shuffle(pool).slice(0, want));
    });
    picked = shuffle(picked);
  }
  if (!picked.length) { alert("Không có câu hỏi phù hợp."); return; }
  if (warn.length && !confirm(warn.join("\n") + "\nVẫn tiếp tục thi với số câu hiện có?")) return;
  begin(picked, 'exam', type === 'cm' ? "Thi chuyên môn" : "Thi văn hóa");
}

/* ---------- Làm bài (chung) ---------- */
function mixOptions(q) {
  if (!shuffleOpts) return {...q};
  const idx = shuffle([0,1,2,3].filter(i => i < q.opts.length));
  return {...q, opts: idx.map(i => q.opts[i]), ans: idx.indexOf(q.ans)};
}
function begin(questions, mode, label) {
  const qs = questions.map(mixOptions);
  session = {qs, mode, label, i: 0, ch: new Array(qs.length).fill(-1), finished: false,
             start: Date.now(), end: Date.now() + EXAM_MINUTES*60000};
  clearInterval(timerId);
  if (mode === 'exam') timerId = setInterval(tick, 500);
  render();
}
function tick() {
  if (!session || session.finished) return;
  const left = Math.max(0, session.end - Date.now());
  const el = document.getElementById('timer');
  if (el) el.textContent = "⏱ " + fmtTime(Math.ceil(left/1000));
  if (left <= 0) finish();
}
function render() {
  const s = session, q = s.qs[s.i], ex = s.mode === 'exam';
  const revealed = s.finished || (!ex && s.ch[s.i] >= 0);
  let opts = q.opts.map((t, k) => {
    let cls = "opt";
    if (revealed) { if (k === q.ans) cls += " ok"; else if (k === s.ch[s.i]) cls += " bad"; }
    else if (s.ch[s.i] === k) cls += " sel";
    return `<button class="${cls}" onclick="choose(${k})">${"ABCD"[k]}. ${esc(t)}</button>`;
  }).join("");
  const grid = s.qs.map((_, n) => {
    let c = n === s.i ? "cur " : "";
    if (s.finished || (!ex && s.ch[n] >= 0)) c += s.ch[n] === s.qs[n].ans ? "ok" : (s.ch[n] >= 0 ? "bad" : "");
    else if (s.ch[n] >= 0) c += "done";
    return `<button class="${c}" onclick="go(${n})">${n+1}</button>`;
  }).join("");
  $app.innerHTML = `
    <div class="card">
      <div class="row"><b>Câu ${s.i+1}/${s.qs.length}</b><span class="muted">${esc(q.cat)}</span><span class="spacer"></span>
        ${ex && !s.finished ? `<span class="timer" id="timer"></span>` : ""}</div>
      <p style="font-size:18px">${esc(q.q)}</p>${opts}
      <div class="row" style="margin-top:12px">
        <button class="sec" onclick="go(${s.i-1})" ${s.i===0?"disabled":""}>← Trước</button>
        <button class="sec" onclick="go(${s.i+1})" ${s.i===s.qs.length-1?"disabled":""}>Sau →</button>
        <span class="spacer"></span>
        ${s.finished ? `<button onclick="showResult()">Xem kết quả</button>` :
          ex ? `<button onclick="if(confirm('Nộp bài?'))finish()">Nộp bài</button>` :
               `<button class="sec" onclick="if(confirm('Thoát ôn luyện?'))practiceMenu()">Thoát</button>`}
      </div>
      <div class="grid">${grid}</div>
    </div>`;
  if (ex && !s.finished) tick();
}
function choose(k) {
  const s = session;
  if (s.finished) return;
  if (s.mode === 'practice' && s.ch[s.i] >= 0) return;
  s.ch[s.i] = k; render();
}
function go(n) { if (n>=0 && n<session.qs.length) { session.i = n; render(); } }
function stats() {
  const s = session;
  const right = s.qs.filter((q, i) => s.ch[i] === q.ans).length;
  const blank = s.ch.filter(c => c < 0).length;
  const total = s.qs.length;
  return {right, blank, wrong: total - right - blank, total, score10: total ? right / total * 10 : 0};
}
function finish() {
  if (!session || session.finished) return;
  clearInterval(timerId);
  session.finished = true;
  const st = stats();
  if (session.mode === 'exam') {
    saveHistory({
      date: Date.now(), exam: fileName, label: session.label,
      used: Math.min(EXAM_MINUTES*60, Math.round((Date.now() - session.start)/1000)),
      ...st
    });
  }
  showResult();
}
function showResult() {
  const s = session, st = stats();
  $app.innerHTML = `<div class="card">
    <h2 style="text-align:center">Kết quả – ${esc(s.label)}</h2>
    <div class="score">${st.right}/${st.total}</div>
    <div class="score10">Điểm: <b>${fmtScore(st.score10)}</b>/10</div>
    <p style="text-align:center">Đúng ${st.right} • Sai ${st.wrong} • Bỏ trống ${st.blank}</p>
    ${s.mode === 'exam' ? `<p class="muted" style="text-align:center">Kết quả đã được lưu vào lịch sử.</p>` : ""}
    <div class="row" style="justify-content:center">
      <button onclick="session.i=0;render()">Xem lại bài làm</button>
      <button class="sec" onclick="modeMenu()">Về menu</button>
      <button class="sec" onclick="historyScreen()">📜 Lịch sử</button>
      <button class="sec" onclick="home()">Chọn chủ đề khác</button>
    </div></div>`;
}

home();
</script>
</body>
</html>
