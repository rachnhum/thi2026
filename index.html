<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thi thử trắc nghiệm</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f1f5f9;color:#1e293b}
  .wrap{max-width:820px;margin:0 auto;padding:16px}
  h1{font-size:22px;text-align:center} h2{font-size:18px}
  .card{background:#fff;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 1px 4px rgba(0,0,0,.1)}
  button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 16px;background:#2563eb;color:#fff}
  button.sec{background:#e2e8f0;color:#1e293b}
  button.danger{background:#dc2626}
  button:disabled{opacity:.5;cursor:default}
  .menu button{display:block;width:100%;margin:8px 0;text-align:left;padding:14px}
  /* NEW: chữ mô tả nhỏ hơn một chút */
  .menu button .muted{color:#fff;font-style:italic;font-size:13px;opacity:.9}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .spacer{flex:1}
  .opt{display:block;width:100%;text-align:left;background:#fff;color:#1e293b;border:2px solid #cbd5e1;margin:8px 0;padding:12px}
  .opt.sel{border-color:#2563eb;background:#eff6ff}
  .opt.ok{border-color:#16a34a;background:#dcfce7}
  .opt.bad{border-color:#dc2626;background:#fee2e2}
  .grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .grid button{width:38px;height:38px;padding:0;background:#e2e8f0;color:#1e293b}
  .grid button.done{background:#93c5fd}
  .grid button.cur{outline:3px solid #1d4ed8}
  .grid button.ok{background:#86efac}.grid button.bad{background:#fca5a5}
  .timer{font-weight:bold;font-size:18px;color:#dc2626}
  .quota label{display:flex;justify-content:space-between;align-items:center;margin:6px 0}
  .quota input{width:80px;padding:6px;font:inherit}
  .muted{color:#64748b;font-size:14px}
  .score{font-size:32px;font-weight:bold;text-align:center;color:#2563eb}
  .score10{font-size:20px;text-align:center;margin:4px 0}
  .hist{border-bottom:1px solid #e2e8f0;padding:10px 0}
  .hist:last-child{border:0}
  .chk{display:flex;gap:8px;align-items:center;margin:10px 0;cursor:pointer}
  .chk input{width:18px;height:18px}

  /* ====== Thầy trò Đường Tăng đi thỉnh kinh ====== */
  .sky{position:relative;height:210px;overflow:hidden;pointer-events:none;margin-top:6px;isolation:isolate;
    border-radius:12px;background:linear-gradient(#bfdbfe,#eff6ff 70%,#f1f5f9)}
  .ground{position:absolute;left:0;right:0;bottom:0;height:30px;z-index:3;
    background:linear-gradient(#bbf7d0,#86efac)}
  .ground:after{content:"";position:absolute;left:0;right:0;bottom:2px;height:14px;
    background:#e7d3a8;opacity:.9}
  .group{position:absolute;left:0;bottom:10px;z-index:5;display:flex;align-items:flex-end;
    transform-origin:left bottom;will-change:transform}
  .ch{flex:none;line-height:0}
  .ch+.ch{margin-left:-6px}
  .pil{display:block;overflow:visible}

  /* dáng đi */
  .legA,.legB{transform-box:fill-box;transform-origin:50% 0}
  .legA{animation:step .36s ease-in-out infinite alternate}
  .legB{animation:step .36s ease-in-out infinite alternate-reverse}
  .horse .legA,.horse .legB{animation-duration:.5s}
  .horse .bob{animation-duration:.5s}
  @keyframes step{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
  .bob{animation:bob .36s ease-in-out infinite alternate}
  @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
  .tail{transform-origin:42px 74px;animation:tail .7s ease-in-out infinite alternate}
  @keyframes tail{from{transform:rotate(-8deg)}to{transform:rotate(12deg)}}
  .flag{transform-origin:80px -14px;animation:flap .5s ease-in-out infinite alternate}
  @keyframes flap{from{transform:skewY(-7deg)}to{transform:skewY(7deg)}}
  .load{transform-origin:30px 30px;animation:sway .72s ease-in-out infinite alternate}
  @keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}

  /* động tác ngẫu nhiên */
  /* 1. Ngựa bạch nhảy 2 chân trước lên */
  .rw{transform-origin:62px 118px}
  .horse.rearing .rw{animation:rear 2s ease-in-out}
  .horse.rearing .bob{animation:none}
  .horse.rearing .rl{animation:none}
  .horse.rearing .fl{animation:paw .3s ease-in-out infinite alternate}
  @keyframes rear{0%{transform:rotate(0)}22%{transform:rotate(-24deg)}38%{transform:rotate(-20deg)}
    54%{transform:rotate(-25deg)}70%{transform:rotate(-22deg)}100%{transform:rotate(0)}}
  @keyframes paw{from{transform:rotate(-22deg)}to{transform:rotate(-52deg)}}
  /* 2. Bát Giới quay cào */
  .rake{transform-origin:84px 57px}
  .bj.twirl{position:relative;z-index:3}
  .bj.twirl .rake{animation:twirl 1.5s ease-in-out}
  @keyframes twirl{from{transform:rotate(0)}to{transform:rotate(720deg)}}
  /* 3. Sa Tăng quay đầu nhìn về phía sau */
  .head{transform-origin:60px 64px}
  .st.lookback .head{animation:lookH 2.6s ease-in-out}
  .st.lookback .eyes{animation:lookE 2.6s ease-in-out}
  @keyframes lookH{0%,100%{transform:translateX(0) rotate(0)}18%,78%{transform:translateX(-4px) rotate(-9deg)}}
  @keyframes lookE{0%,100%{transform:translateX(0)}18%,78%{transform:translateX(-9px)}}
  /* 4. Ngộ Không nhảy tưng tưng */
  .wk.hop .pil{animation:hop .9s ease-out}
  @keyframes hop{0%,100%{transform:translateY(0)}20%{transform:translateY(-28px)}40%{transform:translateY(0)}
    60%{transform:translateY(-18px)}80%{transform:translateY(0)}}

  /* cảnh vật & hiệu ứng môi trường */
  .scn{position:absolute;left:0;top:0;line-height:0;will-change:transform}
  .mtn{z-index:1}
  .ftree{z-index:2;opacity:.75}
  .ntree{z-index:4}
  .stone{z-index:4}
  .cloud{position:absolute;left:0;top:0;z-index:0;will-change:transform}
  .cloud i{position:absolute;background:#fff;border-radius:50%;opacity:.92}
  .bird{position:absolute;left:0;top:0;z-index:2;line-height:0}
  .bird svg{overflow:visible}
  .gust{position:absolute;left:0;top:0;z-index:6;height:2px;border-radius:2px;background:rgba(100,116,139,.4)}
  .dust{position:absolute;left:0;top:0;z-index:6;border-radius:50%;background:rgba(168,140,98,.55);
    filter:blur(1px)}
  .leaf{position:absolute;left:0;top:0;z-index:7;width:10px;height:6px;border-radius:0 100% 0 100%}

  /* ====== Phương tiện bay ngang qua ====== */
  /* NEW: cho phép bấm trúng; padding tạo vùng bấm rộng hơn hình vẽ (vô hình) */
  .air{position:absolute;left:0;top:0;z-index:3;line-height:0;will-change:transform;
    pointer-events:auto;cursor:crosshair;padding:16px 20px;touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  .air.rocket{padding:20px 26px}
  .rotor{transform-box:fill-box;transform-origin:center;animation:rotor .1s linear infinite alternate}
  @keyframes rotor{from{transform:scaleX(1)}to{transform:scaleX(.2)}}
  .rotor2{transform-box:fill-box;transform-origin:center;animation:rotor2 .08s linear infinite alternate}
  @keyframes rotor2{from{transform:scaleY(1)}to{transform:scaleY(.2)}}
  .flame{transform-box:fill-box;transform-origin:right center;animation:flame .08s ease-in-out infinite alternate}
  @keyframes flame{from{transform:scaleX(1)}to{transform:scaleX(.55)}}

  /* NEW: hiệu ứng nổ */
  .boom{position:absolute;left:0;top:0;z-index:8;border-radius:50%;
    background:radial-gradient(circle,#fff 0,#fde047 35%,#f97316 65%,rgba(239,68,68,0) 72%)}
  .spark{position:absolute;left:0;top:0;z-index:8;border-radius:50%}

  /* NEW: popup (phủ toàn màn hình, nằm ngoài .sky nên không bị cắt) */
  .pop-ov{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
    padding:16px;background:rgba(15,23,42,.6);animation:popfade .2s ease-out}
  @keyframes popfade{from{opacity:0}to{opacity:1}}
  .pop{background:#fff;color:#1e293b;border-radius:16px;max-width:380px;width:100%;padding:24px 20px;
    text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.35);animation:popin .25s ease-out}
  @keyframes popin{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
  .pop .big{font-size:42px;line-height:1.1}
  .pop .msg{font-size:18px;font-weight:600;margin:12px 0}
  .pop .note{font-size:14px;color:#b45309;background:#fef3c7;border-radius:8px;padding:8px 10px;margin:12px 0}
  .pop.prize{border:3px solid #facc15;background:linear-gradient(#fffbeb,#fff)}
  .pop.prize .msg{color:#b91c1c;font-size:19px}
  .pop .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;font-weight:700;letter-spacing:1px;
    background:#0f172a;color:#facc15;border-radius:8px;padding:10px;margin:10px 0 4px}
  .pop .when{font-size:13px;color:#64748b;margin-bottom:12px}
  .pop button{min-width:110px}

   /* ====== Thanh thống kê truy cập ====== */
  .vs-bar{--vs-accent:#2563eb;--vs-bg:#0f172a;--vs-text:#fff;--vs-muted:#94a3b8;
    display:flex;justify-content:center;align-items:center;gap:40px;padding:28px 20px;margin-top:30px;
    background:var(--vs-bg);border-top:3px solid var(--vs-accent)}
  .vs-item{text-align:center;min-width:120px}
  .vs-num{display:inline-block;font-size:32px;font-weight:700;color:var(--vs-text);
    letter-spacing:.5px;font-variant-numeric:tabular-nums}
  .vs-label{display:block;margin-top:4px;font-size:12px;text-transform:uppercase;
    letter-spacing:1.5px;color:var(--vs-muted)}
  .vs-divider{width:1px;height:44px;background:rgba(255,255,255,.15)}
  @media (max-width:600px){
    .vs-bar{gap:18px;padding:22px 10px}
    .vs-num{font-size:22px}
    .vs-label{font-size:10px;letter-spacing:1px}
    .vs-item{min-width:0}
    .vs-divider{height:34px}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>📝 Ôn luyện &amp; Thi thử</h1>
  <div id="app"></div>
</div>
 <div class="vs-bar">
  <div class="vs-item"><span class="vs-num" id="vs-total">0</span><span class="vs-label">Tổng lượt truy cập</span></div>
  <div class="vs-divider"></div>
  <div class="vs-item"><span class="vs-num" id="vs-today">0</span><span class="vs-label">Hôm nay</span></div>
  <div class="vs-divider"></div>
  <div class="vs-item"><span class="vs-num" id="vs-yesterday">0</span><span class="vs-label">Hôm qua</span></div>
</div>

<script>
/* ================= CẤU HÌNH ================= */
// Liệt kê tên file Excel ở đây.
// Nếu để trống [], web sẽ tự dò các file .xlsx trong repo qua GitHub API (chỉ chạy khi host trên github.io).
const FILES = [
 "van hoa full.xlsx",
];
// Đặt mật khẩu cho mục nào thì ghi vào đây (tên file phải giống hệt trong FILES).
// Mục nào không ghi, hoặc để "" thì vào tự do, không có khóa.
const LOCKS = {
 "van hoa full.xlsx": "1234",
};
// NEW: Dòng diễn giải hiển thị dưới tên chủ đề (tên file phải giống hệt trong FILES).
// Mục nào không ghi thì chỉ hiện tên chủ đề.
const DESCS = {
 "van hoa full.xlsx": "Văn hóa + chuyên môn QLCP xây dựng",
};
const EXAM_MINUTES = 60;
const TOTAL = 40;
const DEFAULT_QUOTA = {nq:14, nv:12, kt:8, qd:6};
const QUOTA_LABEL = {nq:"Nghị quyết", nv:"Nhiệm vụ", kt:"Kiến thức chung", qd:"Quy định, quy chế"};
const HISTORY_KEY = "thi_history_v1";
const SHUFFLE_KEY = "thi_shuffle_opts";
const HISTORY_MAX = 100;

// NEW: nội dung popup khi bắn trúng máy bay / trực thăng (chọn ngẫu nhiên 1 câu)
const WARN_MSGS = [
  "Ê ê! Bắn nhầm rồi, đó là chuyến bay dân sự đó nha! ✈️",
  "Phi công đang bay về ăn cơm, sao nỡ bắn! 🚁",
  "Cẩn thận, bắn thêm nữa là bị phạt hành chính đó! 😅",
  "Máy bay vừa mới đổ xăng xong mà bạn đã bắn rồi!",
  "Trúng rồi, nhưng chỉ có tiếng nổ chứ không có quà đâu nha! 💥",
  "Bắn chuẩn đó, tiếc là nhầm mục tiêu mất rồi!",
  "Hãng bay đang gửi hóa đơn đền bù cho bạn đây! 🧾",
  "Thầy trò Đường Tăng bảo: \"A Di Đà Phật, tội nghiệp quá!\" 🙏",
  "Ngộ Không lắc đầu: \"Bắn máy bay thì được gì, nhắm tên lửa kìa!\"",
  "Bắn máy bay là vui thôi, còn giải thật nằm ở chỗ khác đó!"
];
const WARN_NOTE = "Lưu ý: chỉ bắn trúng TÊN LỬA mới nhận được giải lớn!";
const PRIZE_MSG = "Chúc mừng bạn đã rất may mắn khi bắn được tên lửa! Nhưng lo mà ôn thi đi chứ, sao rảnh đến mức chơi cái game vô tri này? Chúc bạn thi tốt he he 😜";
/* ============================================ */

const $app = document.getElementById('app');
let data = [];
let fileName = "";
let session = null;
let timerId = null;
let shuffleOpts = localStorage.getItem(SHUFFLE_KEY) !== "0";   // mặc định BẬT

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = [...a]; for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const catKey = s => {
  s = String(s||"").toLowerCase().trim();
  if (s.includes("nghi quyet")) return "nq";
  if (s.includes("nhiem vu")) return "nv";
  if (s.includes("kien thuc chung")) return "kt";
  if (s.includes("quy dinh") || s.includes("quy chế")) return "qd";
  if (s.includes("chuyen mon")) return "cm";
  return "other:" + s;
};
const CULTURE = ["nq","nv","kt","qd"];
const fmtScore = n => (Math.round(n*100)/100).toString().replace('.', ',');
const fmtTime = sec => `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;

/* ---------- Lịch sử (localStorage) ---------- */
function getHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch (e) { return []; }
}
function saveHistory(entry) {
  try {
    const h = getHistory(); h.unshift(entry);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(h.slice(0, HISTORY_MAX)));
  } catch (e) {}
}
function historyScreen() {
  clearInterval(timerId); session = null;
  const h = getHistory();
  let html = `<div class="card"><h2>📜 Lịch sử thi thử</h2>`;
  if (!h.length) html += `<p class="muted">Chưa có bài thi nào được lưu.</p>`;
  else {
    const avg = h.reduce((t, x) => t + x.score10, 0) / h.length;
    html += `<p class="muted">${h.length} bài • điểm trung bình ${fmtScore(avg)}/10</p>`;
    h.forEach(x => {
      html += `<div class="hist">
        <b>${esc(x.exam)}</b> – ${esc(x.label)}<br>
        <span class="muted">${esc(new Date(x.date).toLocaleString('vi-VN'))} • thời gian ${fmtTime(x.used)}</span><br>
        Đúng ${x.right}/${x.total} • Sai ${x.wrong} • Bỏ trống ${x.blank} • <b>${fmtScore(x.score10)}/10</b>
      </div>`;
    });
  }
  html += `<div class="row" style="margin-top:12px">
    <button class="sec" onclick="home()">← Quay lại</button>
    <span class="spacer"></span>
    ${h.length ? `<button class="danger" onclick="clearHistory()">Xóa lịch sử</button>` : ""}
  </div></div>`;
  $app.innerHTML = html;
}
function clearHistory() {
  if (confirm("Xóa toàn bộ lịch sử?")) { localStorage.removeItem(HISTORY_KEY); historyScreen(); }
}

/* ---------- Màn hình 1: chọn file ---------- */
async function home() {
  clearInterval(timerId); session = null;
  $app.innerHTML = `<div class="card"><h2>Chọn chủ đề</h2><div class="menu" id="list">Đang tải danh sách...</div>
    <button class="sec" onclick="historyScreen()">📜 Lịch sử thi thử</button></div>
    <div class="sky" id="sky">
  <div class="ground"></div>
  <div class="group">

    <!-- 4. SA TĂNG (gánh hành lý) -->
    <div class="ch st"><svg class="pil" viewBox="0 0 120 112" width="98">
      <g class="legB"><rect x="62" y="88" width="10" height="16" rx="4" fill="#1e3a8a"/><ellipse cx="68" cy="106" rx="8" ry="4.5" fill="#f8fafc" stroke="#94a3b8"/></g>
      <g class="legA"><rect x="46" y="88" width="10" height="16" rx="4" fill="#1e3a8a"/><ellipse cx="52" cy="106" rx="8" ry="4.5" fill="#f8fafc" stroke="#94a3b8"/></g>
      <g class="bob">
        <g class="load">
          <path d="M22,30 L8,60 M22,30 L38,60" stroke="#b45309" stroke-width="1.5"/>
          <rect x="4" y="60" width="38" height="28" rx="2" fill="#7f1d1d" stroke="#450a0a" stroke-width="1.5"/>
          <path d="M4,68H42M23,60V88" stroke="#450a0a" stroke-width="1.2"/>
          <line x1="14" y1="28" x2="100" y2="52" stroke="#92400e" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M100,40 Q116,54 100,68 Q106,54 100,40Z" fill="#64748b"/>
        </g>
        <path d="M38,92 Q36,62 60,60 Q84,62 82,92Z" fill="#cbd5e1" stroke="#94a3b8"/>
        <path d="M39,80 Q60,86 81,80 L82,92 L38,92Z" fill="#1e3a8a"/>
        <path d="M74,68 Q82,62 80,50" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round" fill="none"/>
        <circle cx="80" cy="48" r="4.5" fill="#d9a678"/>
        <g class="head">
          <circle cx="36" cy="40" r="5" fill="#d9a678"/><circle cx="84" cy="40" r="5" fill="#d9a678"/>
          <circle cx="60" cy="38" r="24" fill="#d9a678"/>
          <path d="M37,28 Q60,12 83,28 L83,34 Q60,22 37,34Z" fill="#cbd5e1" stroke="#64748b"/>
          <path d="M55,21 Q60,28 65,21 Q60,24 55,21Z" fill="#334155"/>
          <path d="M38,42 Q40,66 60,68 Q80,66 82,42 Q70,56 60,54 Q50,56 38,42Z" fill="#1e293b"/>
          <g class="eyes">
            <circle cx="51" cy="39" r="3.6" fill="#111"/><circle cx="69" cy="39" r="3.6" fill="#111"/>
            <circle cx="52" cy="38" r="1.1" fill="#fff"/><circle cx="70" cy="38" r="1.1" fill="#fff"/>
          </g>
        </g>
        <path d="M40,64 Q60,86 80,64" stroke="#7f1d1d" stroke-width="6" stroke-dasharray="0 6.5" stroke-linecap="round" fill="none"/>
      </g>
    </svg></div>

    <!-- 3. BÁT GIỚI -->
    <div class="ch bj"><svg class="pil" viewBox="0 0 100 112" width="82">
      <g class="legB"><rect x="54" y="90" width="10" height="14" rx="4" fill="#1e293b"/><ellipse cx="60" cy="106" rx="8" ry="4.5" fill="#f8fafc" stroke="#94a3b8"/></g>
      <g class="legA"><rect x="38" y="90" width="10" height="14" rx="4" fill="#1e293b"/><ellipse cx="44" cy="106" rx="8" ry="4.5" fill="#f8fafc" stroke="#94a3b8"/></g>
      <g class="bob">
        <g class="rake">
          <line x1="84" y1="14" x2="84" y2="100" stroke="#92400e" stroke-width="3.5"/>
          <rect x="72" y="12" width="26" height="4" rx="1" fill="#94a3b8"/>
          <path d="M74,16V26M80,16V26M88,16V26M94,16V26" stroke="#94a3b8" stroke-width="2.5"/>
        </g>
        <path d="M30,92 Q28,62 50,60 Q72,62 70,92Z" fill="#1e293b"/>
        <rect x="32" y="76" width="36" height="5" fill="#92400e"/>

const unlocked = new Set();   // mục đã nhập đúng mật khẩu (nhớ đến khi tải lại trang)
function openTopic(f) {
  const pw = LOCKS[f];
  if (pw && !unlocked.has(f)) {
    const input = prompt('Mục "' + f.replace(/\.xlsx?$/i, "") + '" có mật khẩu.\nNhập mật khẩu để vào:');
    if (input === null) return;                       // bấm Hủy
    if (input.trim() !== String(pw)) { alert("Sai mật khẩu!"); return; }
    unlocked.add(f);
  }
  loadFile(f);
}
async function autoList() {
  try {
    const host = location.hostname;
    if (!host.endsWith("github.io")) return [];
    const owner = host.split(".")[0];
    const repo = location.pathname.split("/").filter(Boolean)[0];
    const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/`);
    const j = await r.json();
    return j.filter(x => /\.xlsx?$/i.test(x.name)).map(x => x.name);
  } catch (e) { return []; }
}

/* ---------- Đọc Excel ---------- */
async function loadFile(f) {
  $app.innerHTML = `<div class="card">Đang tải "${esc(f)}"...</div>`;
  try {
    // thử tên gốc và cả 2 kiểu mã hóa dấu tiếng Việt
    const names = [...new Set([f, f.normalize("NFC"), f.normalize("NFD")])];
    let res = null, lastStatus = "";
    for (const n of names) {
      const r = await fetch(encodeURIComponent(n).replace(/%2F/g, "/"));
      if (r.ok) { res = r; break; }
      lastStatus = r.status;
    }
    if (!res) throw new Error("Không tìm thấy file trên GitHub (lỗi " + lastStatus + "): " + f +
      ". Hãy kiểm tra tên file thật trong repo (có thể thừa đuôi .xlsx.xlsx hoặc khác chữ hoa/thường).");
    if (typeof XLSX === "undefined")
      throw new Error("Thư viện đọc Excel không tải được. Kiểm tra mạng hoặc thử mạng khác.");
    const wb = XLSX.read(await res.arrayBuffer(), {type: "array"});
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1, defval: ""});
    data = rows.slice(1).filter(r => r[1] && String(r[6]).trim() !== "").map(r => ({
      cat: String(r[0]).trim(), key: catKey(r[0]),
      q: String(r[1]), opts: [r[2], r[3], r[4], r[5]].map(String),
      ans: parseInt(r[6]) - 1
    }));
    if (!data.length)
      throw new Error("Đọc được file nhưng không có câu hỏi hợp lệ. Kiểm tra cột câu hỏi và cột trả lời.");
    fileName = f.replace(/\.xlsx?$/i, "");
    modeMenu();
  } catch (e) {
    $app.innerHTML = `<div class="card"><b>Không tải được file.</b><br>
      <span class="muted">Chi tiết: ${esc(e.message)}</span><br><br>
      <button onclick="home()">← Quay lại</button></div>`;
  }
}

function practiceMenu() {

  seen.forEach((label, key) => {

  });

}
function startPractice(key) {
  const pool = key === 'culture' ? data.filter(d => CULTURE.includes(d.key)) : data.filter(d => d.key === key);
  const label = key === 'culture' ? "Ôn luyện văn hóa" : "Ôn luyện " + (pool[0]?.cat || "");
  begin(shuffle(pool), 'practice', label);
}

function examMenu() {
  $app.innerHTML = `<div class="card"><h2>Thi thử</h2>

    <h3>🎓 Thi văn hóa – số câu mỗi loại</h3>
    <div class="quota">
      ${CULTURE.map(k=>`<label>${QUOTA_LABEL[k]}<input type="number" min="0" id="q_${k}" placeholder="${DEFAULT_QUOTA[k]}"></label>`).join("")}
    </div>
    <p class="muted">Để trống sẽ dùng mặc định 14 – 12 – 8 – 6.</p>
    <button onclick="startExam('vh')">Bắt đầu thi văn hóa</button>
    <button class="sec" onclick="modeMenu()">← Quay lại</button></div>`;

function startExam(type) {
  let picked = [], warn = [];
  if (type === 'cm') {
    const pool = data.filter(d => d.key === 'cm');
    if (pool.length < TOTAL) warn.push(`Chuyên môn chỉ có ${pool.length}/${TOTAL} câu.`);
    picked = shuffle(pool).slice(0, TOTAL);
  } else {
    // Thứ tự nhóm: Nghị quyết -> Nhiệm vụ -> Kiến thức chung -> Quy định, quy chế
    // (trong mỗi nhóm vẫn chọn ngẫu nhiên, KHÔNG xáo trộn lại toàn bộ)
    CULTURE.forEach(k => {
      const v = document.getElementById('q_'+k).value;
      const want = v === "" ? DEFAULT_QUOTA[k] : Math.max(0, parseInt(v)||0);
      const pool = data.filter(d => d.key === k);
      if (pool.length < want) warn.push(`${QUOTA_LABEL[k]}: chỉ có ${pool.length}/${want} câu.`);
      picked.push(...shuffle(pool).slice(0, want));
    });
  }
  if (!picked.length) { alert("Không có câu hỏi phù hợp."); return; }
  if (warn.length && !confirm(warn.join("\n") + "\nVẫn tiếp tục thi với số câu hiện có?")) return;
  begin(picked, 'exam', type === 'cm' ? "Thi chuyên môn" : "Thi văn hóa");
}

/* ---------- Làm bài (chung) ---------- */
function mixOptions(q) {
  if (!shuffleOpts) return {...q};
  const idx = shuffle([0,1,2,3].filter(i => i < q.opts.length));
  return {...q, opts: idx.map(i => q.opts[i]), ans: idx.indexOf(q.ans)};
}
function begin(questions, mode, label) {
  const qs = questions.map(mixOptions);
  session = {qs, mode, label, i: 0, ch: new Array(qs.length).fill(-1), finished: false,
             start: Date.now(), end: Date.now() + EXAM_MINUTES*60000};
  clearInterval(timerId);
  if (mode === 'exam') timerId = setInterval(tick, 500);
  render();
}
function tick() {
  if (!session || session.finished) return;
  const left = Math.max(0, session.end - Date.now());
  const el = document.getElementById('timer');
  if (el) el.textContent = "⏱ " + fmtTime(Math.ceil(left/1000));
  if (left <= 0) finish();
}
function render() {
  const s = session, q = s.qs[s.i], ex = s.mode === 'exam';
  const revealed = s.finished || (!ex && s.ch[s.i] >= 0);
  let opts = q.opts.map((t, k) => {
    let cls = "opt";
    if (revealed) { if (k === q.ans) cls += " ok"; else if (k === s.ch[s.i]) cls += " bad"; }
    else if (s.ch[s.i] === k) cls += " sel";
    return `<button class="${cls}" onclick="choose(${k})">${"ABCD"[k]}. ${esc(t)}</button>`;
  }).join("");
  const grid = s.qs.map((_, n) => {
    let c = n === s.i ? "cur " : "";
    if (s.finished || (!ex && s.ch[n] >= 0)) c += s.ch[n] === s.qs[n].ans ? "ok" : (s.ch[n] >= 0 ? "bad" : "");
    else if (s.ch[n] >= 0) c += "done";
    return `<button class="${c}" onclick="go(${n})">${n+1}</button>`;
  }).join("");
  $app.innerHTML = `
    <div class="card">
      <div class="row"><b>Câu ${s.i+1}/${s.qs.length}</b><span class="muted">${esc(q.cat)}</span><span class="spacer"></span>
        ${ex && !s.finished ? `<span class="timer" id="timer"></span>` : ""}</div>
      <p style="font-size:18px">${esc(q.q)}</p>${opts}
      <div class="row" style="margin-top:12px">
        <button class="sec" onclick="go(${s.i-1})" ${s.i===0?"disabled":""}>← Trước</button>
        <button class="sec" onclick="go(${s.i+1})" ${s.i===s.qs.length-1?"disabled":""}>Sau →</button>
        <span class="spacer"></span>
        ${s.finished ? `<button onclick="showResult()">Xem kết quả</button>` :
          ex ? `<button onclick="if(confirm('Nộp bài?'))finish()">Nộp bài</button>` :
               `<button class="sec" onclick="if(confirm('Thoát ôn luyện?'))practiceMenu()">Thoát</button>`}
      </div>
      <div class="grid">${grid}</div>
    </div>`;
  if (ex && !s.finished) tick();
}
function choose(k) {
  const s = session;
  if (s.finished) return;
  if (s.mode === 'practice' && s.ch[s.i] >= 0) return;
  s.ch[s.i] = k; render();
}
function go(n) { if (n>=0 && n<session.qs.length) { session.i = n; render(); } }
function stats() {
  const s = session;
  const right = s.qs.filter((q, i) => s.ch[i] === q.ans).length;
  const blank = s.ch.filter(c => c < 0).length;
  const total = s.qs.length;
  return {right, blank, wrong: total - right - blank, total, score10: total ? right / total * 10 : 0};
}
function finish() {
  if (!session || session.finished) return;
  clearInterval(timerId);
  session.finished = true;
  const st = stats();
  if (session.mode === 'exam') {
    saveHistory({
      date: Date.now(), exam: fileName, label: session.label,
      used: Math.min(EXAM_MINUTES*60, Math.round((Date.now() - session.start)/1000)),
      ...st
    });
  }
  showResult();
}
function showResult() {
  const s = session, st = stats();
  $app.innerHTML = `<div class="card">
    <h2 style="text-align:center">Kết quả – ${esc(s.label)}</h2>
    <div class="score">${st.right}/${st.total}</div>
    <div class="score10">Điểm: <b>${fmtScore(st.score10)}</b>/10</div>
    <p style="text-align:center">Đúng ${st.right} • Sai ${st.wrong} • Bỏ trống ${st.blank}</p>
    ${s.mode === 'exam' ? `<p class="muted" style="text-align:center">Kết quả đã được lưu vào lịch sử.</p>` : ""}
    <div class="row" style="justify-content:center">
      <button onclick="session.i=0;render()">Xem lại bài làm</button>
      <button class="sec" onclick="modeMenu()">Về menu</button>
      <button class="sec" onclick="historyScreen()">📜 Lịch sử</button>
      <button class="sec" onclick="home()">Chọn chủ đề khác</button>
    </div></div>`;
}

    <div class="msg">${esc(msg)}</div>
    <div class="note">${esc(WARN_NOTE)}</div>
    <button data-close>Đóng</button></div>`, 8000);
}
// Trúng tên lửa: lời chúc vui, nhắc đi ôn thi
function showPrizePopup() {
  openPopup(`<div class="pop prize">
    <div class="big">🎉🚀🎉</div>
    <div class="msg">${esc(PRIZE_MSG)}</div>
    <button data-close>Đi ôn thi thôi!</button></div>`, 0);
}

/* ---------- Thầy trò Đường Tăng đi thỉnh kinh ---------- */
let skyRaf = null, skyToken = 0;
function startSky() {
  cancelAnimationFrame(skyRaf);
  const token = ++skyToken;
  const sky = document.getElementById('sky');
  if (!sky) return;
  const group = sky.querySelector('.group');
  const alive = () => token === skyToken && document.body.contains(sky);
  const R = (a, b) => a + Math.random() * (b - a);
  let W = 0, H = 0, sc = 1, gx = 0;

  /* đoàn thầy trò đứng cố định giữa khung hình */
  const place = () => {
    W = sky.clientWidth; H = sky.clientHeight; sc = W < 520 ? 0.75 : 1;
    gx = Math.max(4, (W - group.offsetWidth * sc) / 2);
    group.style.transform = `translateX(${gx}px) scale(${sc})`;
  };
  place();
  const onResize = () => { if (!alive()) { window.removeEventListener('resize', onResize); return; } place(); };
  window.addEventListener('resize', onResize);

  const spawn = (cls, html) => {
    const e = document.createElement('div');
    e.className = cls; if (html) e.innerHTML = html;
    sky.appendChild(e); return e;
  };
  const fly = (e, frames, dur, opts) => {
    const a = e.animate(frames, Object.assign({duration: dur, easing: 'linear', fill: 'forwards'}, opts));
    a.onfinish = () => e.remove();
  };
  const loop = (fn, min, max, first) => {
    const run = () => {
      if (!alive()) return;
      if (!document.hidden) fn();
      setTimeout(run, R(min, max));
    };
    setTimeout(run, first == null ? R(min, max) : first);
  };

  /* ===== Cảnh vật trôi ngược (視差 parallax: xa thì chậm, gần thì nhanh) ===== */
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const GREENS = [['#2f8f4e', '#47a864'], ['#3b9c5a', '#5cb978'], ['#4d8f3a', '#6fae55']];
  const PINES = ['#1f7a4d', '#2a8c5a', '#2f6f4a'];

  function treeSvg(h) {
    if (Math.random() < .5) {
      const g = pick(GREENS), w = h * .7;
      return {w, html: `<svg width="${w}" height="${h}" viewBox="0 0 70 100">
        <rect x="31" y="58" width="8" height="42" fill="#7c4a21"/>
        <circle cx="35" cy="38" r="26" fill="${g[0]}"/>
        <circle cx="24" cy="48" r="17" fill="${g[1]}"/><circle cx="48" cy="46" r="18" fill="${g[1]}"/></svg>`};
    }
    const c = pick(PINES), w = h * .6;
    return {w, html: `<svg width="${w}" height="${h}" viewBox="0 0 60 100">
      <rect x="27" y="76" width="6" height="24" fill="#6b4423"/>
      <polygon points="30,4 52,44 8,44" fill="${c}"/>
      <polygon points="30,24 56,66 4,66" fill="${c}"/>
      <polygon points="30,44 58,84 2,84" fill="${c}"/></svg>`};
  }
  const mkMountain = () => {
    const w = R(130, 240), h = R(55, 95);
    const p1x = R(35, 80), p1y = R(10, 35), vx = p1x + R(25, 40), vy = R(45, 60), p2x = vx + R(25, 50), p2y = R(5, 30);
    const col = pick(['#b7c9e2', '#a9bdd9', '#c3d3e8']);
    return {cls: 'scn mtn', w, y: H - 26 - h, html:
      `<svg width="${w}" height="${h}" viewBox="0 0 200 100" preserveAspectRatio="none">
        <path d="M0,100 L${p1x},${p1y} L${vx},${vy} L${p2x},${p2y} L200,100Z" fill="${col}"/>
        <path d="M${p2x},${p2y} L${p2x-14},${p2y+20} L${p2x-5},${p2y+16} L${p2x+2},${p2y+24} L${p2x+9},${p2y+15} L${p2x+16},${p2y+19}Z" fill="#fff" opacity=".85"/></svg>`};
  };
  const mkFarTree = () => {
    const h = R(30, 50), t = treeSvg(h);
    return {cls: 'scn ftree', w: t.w, y: H - 26 - h, html: t.html};
  };
  const mkNearTree = () => {
    const h = R(75, 115), t = treeSvg(h);
    return {cls: 'scn ntree', w: t.w, y: H - 16 - h, html: t.html};
  };
  const mkGround = () => {
    if (Math.random() < .5) {
      const w = R(8, 16), h = w * .5;
      return {cls: 'scn stone', w, y: H - R(6, 18) - h, html:
        `<svg width="${w}" height="${h}" viewBox="0 0 20 10"><ellipse cx="10" cy="5" rx="10" ry="5" fill="#a8a29e"/><ellipse cx="8" cy="3.5" rx="5" ry="2" fill="#d6d3d1"/></svg>`};
    }
    return {cls: 'scn stone', w: 16, y: H - R(6, 18) - 12, html:
      `<svg width="16" height="12" viewBox="0 0 16 12"><path d="M3,12 L2,3 M8,12 L8,0 M13,12 L15,4" stroke="#4d8f3a" stroke-width="2" stroke-linecap="round" fill="none"/></svg>`};
  };

  /* một lớp cảnh: các vật nối đuôi nhau trôi sang trái với tốc độ `speed` (px/giây) */
  function layer(make, speed, gMin, gMax) {
    let edge = R(-40, 20), t0 = performance.now();
    const tick = () => {
      if (!alive()) return;
      const now = performance.now();
      edge -= speed * (now - t0) / 1000; t0 = now;
      while (edge < W + 30) {
        const it = make();
        if (edge + it.w > -20) {
          const e = spawn(it.cls, it.html), to = -it.w - 20;
          fly(e, [{transform: `translate(${edge}px,${it.y}px)`}, {transform: `translate(${to}px,${it.y}px)`}],
              (edge - to) / speed * 1000);
        }
        edge += it.w + R(gMin, gMax);
      }
      setTimeout(tick, 300);
    };
    tick();
  }

  /* mây (trôi chậm sang trái theo chiều gió) */
  function cloud(init) {
    const w = R(60, 110);
    const e = spawn('cloud',
      `<i style="left:0;top:${w*.2}px;width:${w*.5}px;height:${w*.3}px"></i>
       <i style="left:${w*.2}px;top:0;width:${w*.5}px;height:${w*.4}px"></i>
       <i style="left:${w*.45}px;top:${w*.18}px;width:${w*.55}px;height:${w*.3}px"></i>`);
    const y = R(8, 70), from = init ? R(0, W) : W + 20, full = R(35000, 55000);
    fly(e, [{transform: `translate(${from}px,${y}px)`}, {transform: `translate(${-w-20}px,${y}px)`}],
        full * (from + w + 20) / (W + w + 40));
  }
  /* chim bay ngang qua (hình đơn giản, cánh vỗ lên xuống bằng cách biến đổi đường cong) */
  function bird() {
    const toLeft = Math.random() < .5;
    const UP = "M1,1 Q7,-3 13,8 Q19,-3 25,1";      // cánh giơ cao
    const MID = "M1,7 Q7,2 13,7 Q19,2 25,7";       // cánh ngang
    const DOWN = "M1,12 Q7,6 13,7 Q19,6 25,12";    // cánh hạ thấp
    const sp = "0.45 0 0.55 1";
    const e = spawn('bird', `<svg viewBox="0 0 26 12" width="26" height="12">
      <path d="${MID}" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <animate attributeName="d" dur=".55s" repeatCount="indefinite" calcMode="spline"
          keyTimes="0;.25;.5;.75;1" keySplines="${sp};${sp};${sp};${sp}"
          values="${UP};${MID};${DOWN};${MID};${UP}"/>
      </path></svg>`);
    const x0 = toLeft ? W + 30 : -40, x1 = toLeft ? -40 : W + 30;
    const y = R(10, 80), a = R(4, 14), fr = [];
    for (let i = 0; i <= 12; i++) {
      const t = i / 12;
      fr.push({transform: `translate(${x0 + (x1 - x0) * t}px,${y + Math.sin(t * 9.4) * a}px)`});
    }
    fly(e, fr, R(7000, 12000));
  }
  /* lá cây bay trong gió
     fast: bay rất nhanh (do tên lửa) | dir: -1 sang trái, 1 sang phải | boost: hệ số tốc độ chung */
  let boost = 1;
  function leaf(fast, dir) {
    dir = dir || -1;
    const e = spawn('leaf');
    e.style.background = ['#16a34a', '#65a30d', '#ca8a04', '#b45309'][Math.floor(Math.random() * 4)];
    const y0 = R(15, H - 70), amp = R(10, 28), ph = R(0, 6.28), drift = R(-10, 50), spin = R(360, 900), fr = [];
    for (let i = 0; i <= 8; i++) {
      const t = i / 8;
      const y = Math.min(H - 32, y0 + drift * t + amp * Math.sin(t * 9 + ph));
      const x = dir < 0 ? W + 20 - (W + 60) * t : -40 + (W + 60) * t;
      fr.push({transform: `translate(${x}px,${y}px) rotate(${spin * t}deg)`});
    }
    fly(e, fr, fast ? R(900, 1700) : R(4500, 8000) / boost);
  }
  /* vệt gió */
  function gust() {
    const w = R(40, 110), e = spawn('gust'), y = R(10, H - 50);
    e.style.width = w + 'px';
    fly(e, [
      {transform: `translate(${W + 20}px,${y}px)`, opacity: 0},
      {opacity: .8, offset: .2}, {opacity: .8, offset: .8},
      {transform: `translate(${-w - 20}px,${y + R(-8, 8)}px)`, opacity: 0}
    ], R(1000, 1700));
  }
  /* bụi dưới chân (target: nhân vật cụ thể, bỏ trống = chọn ngẫu nhiên) */
  function dust(n, big, target) {
    const kids = [...group.children];
    const c = target || kids[Math.floor(Math.random() * kids.length)];
    for (let i = 0; i < n; i++) {
      const e = spawn('dust'), s = big ? R(10, 18) : R(6, 11);
      e.style.width = e.style.height = s + 'px';
      const fx = gx + (c.offsetLeft + c.offsetWidth * R(.25, .75)) * sc, fy = H - 20;
      fly(e, [
        {transform: `translate(${fx}px,${fy}px) scale(.4)`, opacity: .75},
        {transform: `translate(${fx - R(25, 60)}px,${fy - R(big ? 14 : 6, big ? 34 : 20)}px) scale(${R(1.8, 2.8)})`, opacity: 0}
      ], R(700, 1200), {easing: 'ease-out'});
    }
  }

  /* NEW: nổ tung tại vị trí hiện tại của phương tiện (big = tên lửa: pháo hoa nhiều tia hơn) */
  function explode(e, big) {
    const sr = sky.getBoundingClientRect(), r = e.getBoundingClientRect();
    const cx = r.left - sr.left + r.width / 2, cy = r.top - sr.top + r.height / 2;
    e.getAnimations().forEach(a => { a.onfinish = null; a.cancel(); });
    e.remove();
    const fs = big ? 80 : 56, flash = spawn('boom');
    flash.style.width = flash.style.height = fs + 'px';
    fly(flash, [
      {transform: `translate(${cx - fs/2}px,${cy - fs/2}px) scale(.2)`, opacity: 1},
      {transform: `translate(${cx - fs/2}px,${cy - fs/2}px) scale(1.7)`, opacity: 0}
    ], 450, {easing: 'ease-out'});
    const COLORS = big ? ['#facc15', '#f97316', '#ef4444', '#22d3ee', '#a78bfa', '#4ade80', '#f472b6']
                       : ['#facc15', '#f97316', '#ef4444', '#64748b', '#fde68a'];
    const n = big ? 40 : 24;
    for (let i = 0; i < n; i++) {
      const ang = R(0, Math.PI * 2), dist = R(25, big ? 120 : 75), s = R(3, big ? 8 : 6);
      const p = spawn('spark');
      p.style.width = p.style.height = s + 'px';
      p.style.background = pick(COLORS);
      fly(p, [
        {transform: `translate(${cx}px,${cy}px)`, opacity: 1},
        {transform: `translate(${cx + Math.cos(ang) * dist}px,${cy + Math.sin(ang) * dist + 22}px)`, opacity: 0}
      ], R(600, 1200), {easing: 'ease-out'});
    }
  }

  /* các lớp cảnh: tốc độ px/giây (mây ~15) */
  layer(mkMountain, 8, 40, 140);      // núi xa: rất chậm
  layer(mkFarTree, 20, 30, 140);      // cây xa: vừa
  layer(mkNearTree, 42, 220, 520);    // cây gần: nhanh (bằng tốc độ bước chân)
  layer(mkGround, 42, 60, 200);       // đá, cỏ trên đường

  cloud(true); cloud(true); cloud(true);
  loop(() => cloud(false), 7000, 13000);
  loop(bird, 5000, 9000, 1500);
  loop(() => leaf(), 700, 1600, 300);
  loop(gust, 1800, 3500, 600);
  loop(() => dust(1, false), 220, 420);
  loop(() => { dust(6, true); gust(); }, 3500, 6500, 2500);   // thỉnh thoảng bụi cuộn lên

  /* ===== Phương tiện bay ngang qua (cách nhau 10–30 giây, mỗi lần 1 loại) ===== */
  const SVG_ROCKET = `<svg viewBox="0 0 110 36" width="40" height="13">
    <path class="flame" d="M24,12 L0,18 L24,24Z" fill="#fb923c"/>
    <path d="M10,0 L34,8 L24,8Z M10,36 L34,28 L24,28Z" fill="#dc2626"/>
    <path d="M24,8 L80,8 Q104,18 80,28 L24,28Z" fill="#f1f5f9" stroke="#94a3b8"/>
    <path d="M80,8 Q104,18 80,28 Q92,18 80,8Z" fill="#dc2626"/>
    <circle cx="62" cy="18" r="5" fill="#60a5fa" stroke="#1e3a8a"/></svg>`;
  const SVG_BOEING = `<svg viewBox="0 0 140 44" width="42" height="13">
    <path d="M118,14 L132,0 L139,0 L131,16Z" fill="#2563eb"/>
    <path d="M60,24 L92,24 L102,42 L84,42Z" fill="#cbd5e1" stroke="#94a3b8"/>
    <ellipse cx="78" cy="38" rx="8" ry="3.5" fill="#94a3b8"/>
    <path d="M8,22 Q10,14 28,13 L118,13 Q132,14 137,20 L137,24 Q132,29 118,30 L28,30 Q10,30 8,22Z" fill="#f8fafc" stroke="#94a3b8"/>
    <path d="M14,24 H132" stroke="#2563eb" stroke-width="3"/>
    <path d="M30,19 H112" stroke="#60a5fa" stroke-width="3" stroke-dasharray="4 4"/>
    <path d="M12,20 Q16,15 24,15 L24,20Z" fill="#60a5fa"/></svg>`;
  const SVG_HELI = `<svg viewBox="0 0 100 50" width="36" height="18">
    <ellipse class="rotor" cx="40" cy="8" rx="40" ry="2.5" fill="#475569"/>
    <rect x="38" y="9" width="4" height="8" fill="#334155"/>
    <rect x="62" y="24" width="34" height="5" rx="2" fill="#dc2626"/>
    <path d="M90,25 L97,10 L100,26Z" fill="#b91c1c"/>
    <ellipse class="rotor2" cx="97" cy="18" rx="2.5" ry="9" fill="#475569"/>
    <ellipse cx="40" cy="28" rx="26" ry="14" fill="#dc2626"/>
    <path d="M18,28 Q20,17 34,17 L34,30 L18,30Z" fill="#bae6fd" stroke="#0369a1"/>
    <path d="M16,46 H62 M28,40 V46 M50,40 V46" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/></svg>`;

  function flyby() {
    const r = Math.random();
    const type = r < 0.05 ? 'rocket' : (r < 0.35 ? 'boeing' : 'heli');   // 5% – 30% – 65% (giữ nguyên)
    const svg = {rocket: SVG_ROCKET, boeing: SVG_BOEING, heli: SVG_HELI}[type];
    const e = spawn('air ' + type, svg);
    const w = e.offsetWidth || 40;
    const y = R(40, 110);   // tầm thấp hơn để lọt sau thầy trò và cây lớn
    let toLeft = true;
    if (type === 'rocket') toLeft = Math.random() < .5;   // chỉ tên lửa bay được 2 chiều
    const x0 = toLeft ? W + 20 : -w - 20, x1 = toLeft ? -w - 20 : W + 20;
    const flip = (type === 'rocket' && toLeft) ? ' scaleX(-1)' : '';
    // Boeing, trực thăng vẽ hướng sang trái; tên lửa vẽ hướng sang phải (lật khi bay sang trái)

    /* NEW: bấm trúng -> nổ tung -> popup (mỗi phương tiện chỉ tính 1 lần, popup đang mở thì bỏ qua) */
    let hit = false;
    e.addEventListener('pointerdown', ev => {
      ev.preventDefault();
      if (hit || popupOpen) return;
      hit = true; popupOpen = true;
      explode(e, type === 'rocket');
      setTimeout(() => { type === 'rocket' ? showPrizePopup() : showWarnPopup(); }, 450);
    });

    if (type === 'rocket') {
      const dur = R(2500, 3000);   // NEW: bay chậm hơn một chút (trước đây 1,6–2,2 giây) để kịp bấm
      fly(e, [{transform: `translate(${x0}px,${y}px)${flip}`}, {transform: `translate(${x1}px,${y}px)${flip}`}], dur);
      // gió từ tên lửa: lá bay nhanh hơn trong lúc bay và một lúc sau đó
      boost = 4;
      setTimeout(() => { boost = 1; }, dur + 2500);
      const dir = toLeft ? -1 : 1;
      for (let i = 0; i < 28; i++) setTimeout(() => { if (alive()) leaf(true, dir); }, R(0, dur + 600));
      for (let i = 0; i < 4; i++) setTimeout(() => { if (alive()) gust(); }, R(0, dur));
    } else if (type === 'boeing') {
      fly(e, [{transform: `translate(${x0}px,${y}px)`}, {transform: `translate(${x1}px,${y}px)`}], R(9000, 12000));
    } else {   // trực thăng: bay chậm, hơi nhấp nhô
      const dur = R(11000, 15000), fr = [];
      for (let i = 0; i <= 10; i++) {
        const t = i / 10;
        fr.push({transform: `translate(${x0 + (x1 - x0) * t}px,${y + Math.sin(t * 12) * 4}px)`});
      }
      fly(e, fr, dur);
    }
  }
  loop(flyby, 10000, 30000, R(4000, 8000));   // lần đầu sau 4–8 giây, sau đó cách nhau 10–30 giây

  /* ===== Động tác ngẫu nhiên của thầy trò ===== */
  const wk = group.querySelector('.wk'), hs = group.querySelector('.horse'),
        bj = group.querySelector('.bj'), st = group.querySelector('.st');
  let busy = false, lastA = -1;
  const act = (el, cls, ms, after) => {
    busy = true; el.classList.add(cls);
    setTimeout(() => {
      el.classList.remove(cls); busy = false;
      if (after && alive()) after();
    }, ms);
  };
  const ACTIONS = [
    () => act(hs, 'rearing', 2000, () => dust(6, true, hs)),   // ngựa nhảy 2 chân trước lên
    () => act(bj, 'twirl', 1500),                              // Bát Giới quay cào
    () => act(st, 'lookback', 2600),                           // Sa Tăng quay đầu nhìn lại
    () => act(wk, 'hop', 900, () => dust(4, true, wk)),        // Ngộ Không nhảy tưng tưng
  ];
  loop(() => {
    if (busy) return;
    let i; do { i = Math.floor(Math.random() * ACTIONS.length); } while (i === lastA);
    lastA = i; ACTIONS[i]();
  }, 3500, 7000, 2500);
}

home();
</script>
 <script>
(function () {
  var NS = "thithu-ten-rieng-cua-anh";   // <-- ĐỔI thành tên riêng, không dấu, không khoảng trắng
  var BASE = "https://abacus.jasoncameron.dev";

  function dayKey(offset) {
    var d = new Date(Date.now() + offset * 86400000);
    return "d" + d.getFullYear() + ("0" + (d.getMonth() + 1)).slice(-2) + ("0" + d.getDate()).slice(-2);
  }
  function call(action, key) {
    return fetch(BASE + "/" + action + "/" + NS + "/" + key)
      .then(function (r) { return r.ok ? r.json() : { value: 0 }; })
      .then(function (j) { return j.value || 0; })
      .catch(function () { return 0; });
  }
  function animate(id, target) {
    var el = document.getElementById(id), start = null, duration = 1200;
    function step(t) {
      if (!start) start = t;
      var p = Math.min((t - start) / duration, 1);
      el.textContent = Math.floor(target * (1 - Math.pow(1 - p, 3))).toLocaleString("vi-VN");
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  var today = dayKey(0), yesterday = dayKey(-1);
  var counted = localStorage.getItem("vs_last") === today;   // mỗi trình duyệt chỉ tính 1 lượt/ngày
  var action = counted ? "get" : "hit";
  if (!counted) localStorage.setItem("vs_last", today);

  Promise.all([call(action, "total"), call(action, today), call("get", yesterday)])
    .then(function (v) {
      animate("vs-total", v[0]);
      animate("vs-today", v[1]);
      animate("vs-yesterday", v[2]);
    });
})();
</script>
